<path d="M13 204 107 18 201 204"/><path d="M46 145 H168"/><path d="M112 18V0" stroke-width="5"/><path d="M107 218V240" stroke-width="5"/>
</g>
<g fill="#c9b48c"><circle cx="847" cy="166" r="3"/><circle cx="1193" cy="259" r="3"/><circle cx="1083" cy="25" r="2"/></g>

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="398" viewBox="0 0 1280 398" role="img" aria-label="am3rix: technology research across security, systems, and computation">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080c13"/><stop offset=".6" stop-color="#101a25"/><stop offset="1" stop-color="#0b111b"/></linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#d8c49e"/><stop offset=".5" stop-color="#8b9ba5"/><stop offset="1" stop-color="#313e4c"/></linearGradient>
<linearGradient id="monogram" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f0ebdc"/><stop offset=".42" stop-color="#b9c4c7"/><stop offset=".68" stop-color="#748996"/><stop offset="1" stop-color="#d0b791"/></linearGradient>
<radialGradient id="glow"><stop stop-color="#c1ad83" stop-opacity=".19"/><stop offset="1" stop-color="#c1ad83" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#536779" stroke-opacity=".15" stroke-width="1"/></pattern>
</defs>
<rect width="1280" height="398" rx="10" fill="url(#bg)"/>
<rect width="1280" height="398" rx="10" fill="url(#grid)"/>
<circle cx="1010" cy="181" r="322" fill="url(#glow)"/>
<path d="M0 1 H1280" stroke="#66737c" opacity=".4"/><path d="M0 397H1280" stroke="url(#edge)" stroke-width="2" opacity=".72"/>
<path d="M698 0 V398" stroke="#6a7480" opacity=".25"/>
<g font-family="Arial,Helvetica,sans-serif">
<text x="74" y="78" fill="#beaa88" font-size="15" letter-spacing="3.1">RESEARCH · ENGINEERING · EXPERIMENTATION</text>
<text x="66" y="211" fill="#f0f1ed" font-size="112" font-weight="700" letter-spacing="-6">am3rix</text>
<path d="M75 236H575" stroke="#7d8f9b" opacity=".6"/>
<text x="74" y="282" fill="#b2c1ca" font-size="21" letter-spacing=".6">Across disciplines. Down to first principles.</text>
<text x="74" y="347" fill="#8798a7" font-size="14">Systems  /  Security  /  Computation  /  Emerging technology</text>
</g>
<!-- architectural A and perspective ring -->
<g fill="none" stroke="#8798a6" stroke-opacity=".26">
<ellipse cx="1031" cy="203" rx="227" ry="77" transform="rotate(-18 1031 203)" stroke-width="2"/>
<ellipse cx="1031" cy="203" rx="173" ry="190" transform="rotate(-18 1031 203)" stroke-width="1"/>

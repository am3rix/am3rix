<path d="M742 367H1144" stroke="#cab28b" stroke-width="2" opacity=".25"/>
<rect x="741" y="364" width="56" height="5" fill="#d6c5a4" rx="2" opacity=".8"><animate attributeName="x" from="742" to="1090" dur="8s" repeatCount="indefinite"/></rect>
</svg>